<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c77c3"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="959" height="319" rx="16" fill="#ffffff" stroke="#d0d7de"/>

  <text x="480" y="40" text-anchor="middle" fill="#0a328f" font-size="18" font-weight="600">From a base64 photo in JavaScript to a match or liveness result</text>

  <!-- Box 1: React Native app -->
  <rect x="30" y="90" width="160" height="100" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="110" y="130" text-anchor="middle" fill="#0a328f" font-size="16">Your app</text>
  <text x="110" y="152" text-anchor="middle" fill="#0a328f" font-size="16">(React Native)</text>
  <text x="110" y="215" text-anchor="middle" fill="#57606a" font-size="13">selfie and document</text>
  <text x="110" y="233" text-anchor="middle" fill="#57606a" font-size="13">photo as base64</text>

  <line x1="192" y1="140" x2="218" y2="140" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 2: JS API -->
  <rect x="220" y="90" width="160" height="100" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="300" y="130" text-anchor="middle" fill="#0a328f" font-size="16">JavaScript API</text>
  <text x="300" y="152" text-anchor="middle" fill="#0a328f" font-size="16">src/index.tsx</text>
  <text x="300" y="215" text-anchor="middle" fill="#57606a" font-size="13">faceCompare, faceScore,</text>
  <text x="300" y="233" text-anchor="middle" fill="#57606a" font-size="13">livenessScore, ...</text>

  <line x1="382" y1="140" x2="408" y2="140" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 3: native module -->
  <rect x="410" y="90" width="160" height="100" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="490" y="130" text-anchor="middle" fill="#0a328f" font-size="16">Native module</text>
  <text x="490" y="152" text-anchor="middle" fill="#0a328f" font-size="16">Kotlin / Swift</text>
  <text x="490" y="215" text-anchor="middle" fill="#57606a" font-size="13">decodes base64 to a</text>
  <text x="490" y="233" text-anchor="middle" fill="#57606a" font-size="13">Bitmap or CGImage</text>

  <line x1="572" y1="140" x2="598" y2="140" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 4: Biometric SDK -->
  <rect x="600" y="90" width="160" height="100" rx="10" fill="#eaf4ff" stroke="#1c77c3"/>
  <text x="680" y="130" text-anchor="middle" fill="#0a328f" font-size="16">Iriscan</text>
  <text x="680" y="152" text-anchor="middle" fill="#0a328f" font-size="16">Biometric SDK 0.6.0</text>
  <text x="680" y="215" text-anchor="middle" fill="#57606a" font-size="13">finds the face, runs the</text>
  <text x="680" y="233" text-anchor="middle" fill="#57606a" font-size="13">TensorFlow Lite models</text>

  <line x1="762" y1="140" x2="788" y2="140" stroke="#1c77c3" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Box 5: result -->
  <rect x="790" y="90" width="150" height="100" rx="10" fill="#eaf4ff" stroke="#5cc8ff" stroke-width="2"/>
  <text x="865" y="124" text-anchor="middle" fill="#0a328f" font-size="16">Result</text>
  <text x="865" y="146" text-anchor="middle" fill="#0a328f" font-size="16">same person?</text>
  <text x="865" y="168" text-anchor="middle" fill="#0a328f" font-size="16">live photo?</text>
  <text x="865" y="215" text-anchor="middle" fill="#57606a" font-size="13">boolean, score or</text>
  <text x="865" y="233" text-anchor="middle" fill="#57606a" font-size="13">head direction</text>

  <text x="480" y="285" text-anchor="middle" fill="#57606a" font-size="13">Everything runs on the phone. No image or template is sent to a server.</text>
</svg>
